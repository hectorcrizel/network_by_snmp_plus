zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a64a03f8acfc4f02b7394c5b3a46a626
      name: Empresa
    - uuid: a1bd2178ce584bbfa491eee92225adc6
      name: Empresa/Cliente
    - uuid: 88ca23b4970445d4a138bb10ab3524b8
      name: 'Templates/Network devices'
  templates:
    - uuid: 112a4a2fc6a14e6e92557a9fd593caad
      template: 'Network by SNMP with Loss Zabbix Tools'
      name: 'Network by SNMP with Loss Zabbix Tools'
      description: |
        Template Net Network Generic Device
        
        MIBs used:
        EtherLike-MIB
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        IF-MIB
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: Empresa
        - name: Empresa/Cliente
        - name: 'Templates/Network devices'
      items:
        - uuid: ba4567c3e537418b9a6f0a17b1e99732
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          history: 7d
          value_type: CHAR
          trends: '0'
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 9777cbfeb1a2489387551b2b17c77c82
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.1.1.0
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 30s
          history: 7d
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB [RFC1907] because sysUpTime is the uptime of the network management portion of the system.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 998142ac5e8146f5bb8f2c189f87290a
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 15m
          history: 7d
          value_type: CHAR
          trends: '0'
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name.  If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 183e7d27b27e463ca12ee9e876d04046
              expression: 'last(/Network by SNMP with Loss Zabbix Tools/system.name,#1)<>last(/Network by SNMP with Loss Zabbix Tools/system.name,#2) and length(last(/Network by SNMP with Loss Zabbix Tools/system.name))>0'
              name: 'Network Generic Device: System name has changed'
              event_name: 'Network Generic Device: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 92c2623d0fd240f2bd53071591eb23a1
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          history: 7d
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 3785eabd66dd418b9ccef59e21a5820f
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 62822109c8954ccfbf43efccfffd43d7
              expression: 'max(/Network by SNMP with Loss Zabbix Tools/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Network Generic Device: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 7ed2d503aab647c09cfd5ba7a5a6380b
          name: 'Interface discovery (extra counters)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: if.discovery.extra
          delay: 1h
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: '{$IFNAME.INCLUDE}'
                formulaid: A
          item_prototypes:
            - uuid: ee5fbddc01324367bc6cc99bea8d158d
              name: '% error/loss packets (unicast) {#IFNAME} {#IFALIAS}'
              type: CALCULATED
              key: 'net.if.bad.pct.ucast[{#SNMPINDEX}]'
              value_type: FLOAT
              units: '%'
              params: |
                100 * (
                  max(0,change(//net.if.in.errors[ifInErrors.{#SNMPINDEX}])) +
                  max(0,change(//net.if.out.errors[ifOutErrors.{#SNMPINDEX}])) +
                  max(0,change(//net.if.in.discards[ifInDiscards.{#SNMPINDEX}])) +
                  max(0,change(//net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]))
                ) / (
                  max(0,change(//net.if.in.ucast[ifInUcastPkts.{#SNMPINDEX}])) +
                  max(0,change(//net.if.out.ucast[ifOutUcastPkts.{#SNMPINDEX}])) +
                  max(0,change(//net.if.in.errors[ifInErrors.{#SNMPINDEX}])) +
                  max(0,change(//net.if.out.errors[ifOutErrors.{#SNMPINDEX}])) +
                  max(0,change(//net.if.in.discards[ifInDiscards.{#SNMPINDEX}])) +
                  max(0,change(//net.if.out.discards[ifOutDiscards.{#SNMPINDEX}])) +
                  0.000001
                )
              trigger_prototypes:
                - uuid: 12bb05d8b4494c0886be6c5ef0381b52
                  expression: 'avg(/Network by SNMP with Loss Zabbix Tools/net.if.bad.pct.ucast[{#SNMPINDEX}],5m) > 3'
                  name: 'Interface {#IFNAME} {#IFALIAS}: high packet loss/error rate'
                  priority: WARNING
            - uuid: 9e1d7b20bce24427966f88b7ebfe926f
              name: 'InDiscards {#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
            - uuid: 7cad006cce8c4c44a063841942b358dc
              name: 'InErrors {#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
            - uuid: 51d2b0a2ae134b87b23f5e79268b3a26
              name: 'InUcastPkts {#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.11.{#SNMPINDEX}'
              key: 'net.if.in.ucast[ifInUcastPkts.{#SNMPINDEX}]'
            - uuid: aee28a655d3c4fdea858b514b4d0d346
              name: 'OutDiscards {#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
            - uuid: 10b5778e62414e559eff48d03a56c12e
              name: 'OutErrors {#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
            - uuid: f1b3690be54c4dcabb18242863052214
              name: 'OutUcastPkts {#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.17.{#SNMPINDEX}'
              key: 'net.if.out.ucast[ifOutUcastPkts.{#SNMPINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      var lld = JSON.parse(value);
                      // Captura a macro. O Zabbix substitui o valor aqui antes de rodar.
                      var rawMap = '{$CIRCUITOS.MAP}'; 
                      
                      // Se a macro não for resolvida ou for o texto da própria macro, para aqui.
                      if (rawMap === "" || rawMap === "{\$CIRCUITOS.MAP}") {
                          return value;
                      }
                  
                      var map = JSON.parse(rawMap);
                  
                      for (var i = 0; i < lld.length; i++) {
                          // Trim remove espaços invisíveis que podem vir do SNMP
                          var key = (lld[i]['{#IFNAME}'] || "").toString().trim();
                  
                          if (key && map[key]) {
                              lld[i]['{#TAG_CIRCUITO}'] = map[key].circuito;
                              lld[i]['{#TAG_CLIENTE}']  = map[key].cliente;
                              lld[i]['{#TAG_LOCAL}']    = map[key].localidade;
                          }
                      }
                      return JSON.stringify(lld);
                  } catch (error) {
                      // Se houver erro no JSON da macro, ele avisa no log do teste
                      return JSON.stringify([{"DEBUG_ERROR": error.message, "RAW_MACRO": rawMap}]);
                  }
          overrides:
            - name: 'Add tag'
              step: '1'
              filter:
                conditions:
                  - macro: '{#TAG_CIRCUITO}'
                    value: .+
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: '.*'
                  tags:
                    - tag: Circuito
                      value: '{#TAG_CIRCUITO}'
                    - tag: Cliente
                      value: '{#TAG_CLIENTE}'
                    - tag: Localidade
                      value: '{#TAG_LOCAL}'
        - uuid: 45d1d614550f41df86ca29061da4163a
          name: 'Mapeamento de APs via CDP'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.23.1.2.1.1.6, 1.3.6.1.4.1.9.9.23.1.2.1.1.8, 1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.4.1.9.9.23.1.2.1.1.4]'
          key: map.discovery.aps
          delay: 1h
          item_prototypes:
            - uuid: 2b38348a12574b6187c8d7a26ea7f617
              name: 'AP {#HOST}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#IFINDEX}'
              key: 'ap.if.in[{#IFINDEX}]'
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: host
                  value: '{#HOST}'
                - tag: porta
                  value: '{#PORTA}'
            - uuid: 1ae5168daf58430481dcce162d530815
              name: 'AP {#HOST}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#IFINDEX}'
              key: 'ap.if.out[{#IFINDEX}]'
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: host
                  value: '{#HOST}'
                - tag: porta
                  value: '{#PORTA}'
            - uuid: 63853c9e96da4374a24f024d69a67968
              name: 'AP {#HOST}: Status de Ping'
              type: SIMPLE
              key: 'icmpping[{#IP},3,200]'
              tags:
                - tag: host
                  value: '{#HOST}'
                - tag: ip
                  value: '{#IP}'
                - tag: porta
                  value: '{#PORTA}'
              trigger_prototypes:
                - uuid: 6592b0e53a794af5aedc5e745ee41a6b
                  expression: 'last(/Network by SNMP with Loss Zabbix Tools/icmpping[{#IP},3,200])=0'
                  name: 'AP {#HOST} está down na porta {#PORTA}'
                  priority: AVERAGE
            - uuid: a5df163ecee049fda8627c05b6feb960
              name: 'Mapeamento AP: {#HOST}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.1.{#IFINDEX}'
              key: 'map.ap.infos[{#IFINDEX}]'
              value_type: CHAR
              trends: '0'
              tags:
                - tag: host
                  value: '{#HOST}'
                - tag: porta
                  value: '{#PORTA}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Separa o texto puro em linhas
                  var lines = value.split('\n');
                  var ifNames = {};
                  var cdpNames = {};
                  var cdpPlatforms = {};
                  var cdpIps = {}; // NOVA TABELA: Guarda os IPs
                  
                  lines.forEach(function(line) {
                      if (line.trim() === '') return;
                  
                      // Corta a linha no sinal de igual (Ex: .1.3.6... = STRING: "Vl1")
                      var partes = line.split(/=(.+)/);
                      if (partes.length < 2) return;
                  
                      var oid = partes[0].trim();
                      var valRaw = partes[1].trim();
                  
                      // Limpa a sujeira do SNMP (tira o 'STRING: ', 'Hex-STRING: ' e as aspas)
                      var val = valRaw.replace(/^[A-Za-z0-9\-]+:\s*/, '').replace(/^"|"$/g, '');
                  
                      // Guarda na tabela de Nomes de Porta
                      if (oid.indexOf('.1.3.6.1.2.1.31.1.1.1.1.') !== -1) {
                          var splitted = oid.split('.');
                          ifNames[splitted[splitted.length - 1]] = val;
                      }
                      // Guarda na tabela de Hostnames do CDP
                      else if (oid.indexOf('.1.3.6.1.4.1.9.9.23.1.2.1.1.6.') !== -1) {
                          var splitted = oid.split('.');
                          cdpNames[splitted[splitted.length - 2]] = val;
                      }
                      // Guarda na tabela de Modelos do CDP
                      else if (oid.indexOf('.1.3.6.1.4.1.9.9.23.1.2.1.1.8.') !== -1) {
                          var splitted = oid.split('.');
                          cdpPlatforms[splitted[splitted.length - 2]] = val;
                      }
                      // NOVO: Guarda na tabela de IPs do CDP e converte se for Hexadecimal
                      else if (oid.indexOf('.1.3.6.1.4.1.9.9.23.1.2.1.1.4.') !== -1) {
                          var splitted = oid.split('.');
                          var idx = splitted[splitted.length - 2];
                  
                          // Verifica se o valor já é um IP legível (ex: 192.168.1.10)
                          if (val.indexOf('.') !== -1 && val.match(/\d+\.\d+\.\d+\.\d+/)) {
                              cdpIps[idx] = val;
                          } else {
                              // Se for Hexadecimal (ex: C0 A8 01 0A), remove espaços e converte
                              var hex = val.replace(/[^0-9A-Fa-f]/g, '');
                              if (hex.length >= 8) {
                                  cdpIps[idx] = parseInt(hex.substr(0, 2), 16) + '.' +
                                                parseInt(hex.substr(2, 2), 16) + '.' +
                                                parseInt(hex.substr(4, 2), 16) + '.' +
                                                parseInt(hex.substr(6, 2), 16);
                              } else {
                                  cdpIps[idx] = val; // Mantém o original em caso de leitura anômala
                              }
                          }
                      }
                  });
                  
                  var lld = [];
                  var apRegex = /AIR-|C91|CW91|Cisco AP|LAP|WAP|Aironet/i;
                  
                  // Cruza os dados
                  for (var idx in cdpNames) {
                      var platform = cdpPlatforms[idx] || "";
                      var ip = cdpIps[idx] || ""; // Resgata o IP recém-processado
                      
                      // Filtra pelo modelo de AP E garante que capturou um IP válido
                      if (apRegex.test(platform) && ip.match(/\d+\.\d+\.\d+\.\d+/)) {
                          var fullPort = ifNames[idx] || "Unknown";
                          
                          // Corta pra Gi, Te, Fa
                          var shortPort = fullPort.replace('GigabitEthernet', 'Gi')
                                                  .replace('TenGigabitEthernet', 'Te')
                                                  .replace('FastEthernet', 'Fa');
                          
                          // Cria a linha perfeita pro Zabbix, agora com o IP
                          lld.push({
                              "{#HOST}": cdpNames[idx],
                              "{#PORTA}": shortPort,
                              "{#IFINDEX}": idx,
                              "{#IP}": ip
                          });
                      }
                  }
                  
                  return JSON.stringify(lld);
        - uuid: dbd7f307da174b08912f881bb5b281a5
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
                formulaid: A
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: C
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: E
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: F
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
                formulaid: G
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: H
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
                formulaid: I
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: J
              - macro: '{#SNMPINDEX}'
                value: '{$NET.IF.INDEX.MATCHES}'
                formulaid: K
          description: 'Discovering interfaces from IF-MIB.'
          item_prototypes:
            - uuid: 574fb1b20c004d56813ffbad07f8d439
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}'
              key: 'net.if.in[ifInOctets.{#SNMPINDEX}]'
              history: 7d
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets received on the interface,including framing characters. Discontinuities in the value of this counter can occur at re-initialization of the management system, and another times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              trigger_prototypes:
                - uuid: 62047e7215dd469f9ec352ebddac9ea3
                  expression: |
                    avg(/Network by SNMP with Loss Zabbix Tools/net.if.in[ifInOctets.{#SNMPINDEX}],3m)
                        > {$IF.IN.WARN:"{#IFNAME}"}
                  name: 'Interface {#IFNAME}({#IFALIAS}): tráfego de entrada alto'
                  priority: WARNING
                  dependencies:
                    - name: 'Interface {#IFNAME}({#IFALIAS}): tráfego de entrada CRÍTICO'
                      expression: |
                        avg(/Network by SNMP with Loss Zabbix Tools/net.if.in[ifInOctets.{#SNMPINDEX}],3m)
                            > {$IF.IN.HIGH:"{#IFNAME}"}
                - uuid: 86be2363de4348db830c7a594fdac3ee
                  expression: |
                    avg(/Network by SNMP with Loss Zabbix Tools/net.if.in[ifInOctets.{#SNMPINDEX}],3m)
                        > {$IF.IN.HIGH:"{#IFNAME}"}
                  name: 'Interface {#IFNAME}({#IFALIAS}): tráfego de entrada CRÍTICO'
                  priority: HIGH
            - uuid: 7779dcfb3329401386bc368f89dc1672
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}'
              key: 'net.if.out[ifOutOctets.{#SNMPINDEX}]'
              history: 7d
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets transmitted out of the interface, including framing characters. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              trigger_prototypes:
                - uuid: f1eea161490e49449c6b5f00a44b98d0
                  expression: |
                    avg(/Network by SNMP with Loss Zabbix Tools/net.if.out[ifOutOctets.{#SNMPINDEX}],3m)
                        > {$IF.OUT.WARN:"{#IFNAME}"}
                  name: 'Interface {#IFNAME}({#IFALIAS}): tráfego de saída alto'
                  priority: WARNING
                - uuid: 4a34556742b5480cacf0cd11c7bf1d89
                  expression: |
                    avg(/Network by SNMP with Loss Zabbix Tools/net.if.out[ifOutOctets.{#SNMPINDEX}],3m)
                        > {$IF.OUT.HIGH:"{#IFNAME}"}
                  name: 'Interface {#IFNAME}({#IFALIAS}): tráfego de saída CRÍTICO'
                  priority: HIGH
                  dependencies:
                    - name: 'Interface {#IFNAME}({#IFALIAS}): tráfego de saída alto'
                      expression: |
                        avg(/Network by SNMP with Loss Zabbix Tools/net.if.out[ifOutOctets.{#SNMPINDEX}],3m)
                            > {$IF.OUT.WARN:"{#IFNAME}"}
            - uuid: 5b2a76b8ec9347fbb9e756b40404544a
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              description: |
                MIB: IF-MIB
                The current operational state of the interface.
                - The testing(3) state indicates that no operational packet scan be passed
                - If ifAdminStatus is down(2) then ifOperStatus should be down(2)
                - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit and receive network traffic
                - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting for an incoming connection)
                - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1) state
                - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              trigger_prototypes:
                - uuid: cfaa1509ab324a5199c4ca1769b53fed
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Network by SNMP with Loss Zabbix Tools/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Network by SNMP with Loss Zabbix Tools/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Network by SNMP with Loss Zabbix Tools/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Network by SNMP with Loss Zabbix Tools/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'Network Generic Device: Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the operations status is down.
                    2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not important. No new trigger will be fired if this interface is down.
                    3. `{TEMPLATE_NAME:METRIC.diff()}=1` - the trigger fires only if the operational status was up to (1) sometime before (so, does not fire for "eternal off" interfaces.)
                    
                    WARNING: if closed manually - it will not fire again on the next poll, because of .diff.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
          graph_prototypes:
            - uuid: 82a5a467d8b6403fbdb89f091212674d
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Network by SNMP with Loss Zabbix Tools'
                    key: 'net.if.in[ifInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Network by SNMP with Loss Zabbix Tools'
                    key: 'net.if.out[ifOutOctets.{#SNMPINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      var lld = JSON.parse(value);
                      // Captura a macro. O Zabbix substitui o valor aqui antes de rodar.
                      var rawMap = '{$CIRCUITOS.MAP}'; 
                      
                      // Se a macro não for resolvida ou for o texto da própria macro, para aqui.
                      if (rawMap === "" || rawMap === "{\$CIRCUITOS.MAP}") {
                          return value;
                      }
                  
                      var map = JSON.parse(rawMap);
                  
                      for (var i = 0; i < lld.length; i++) {
                          // Trim remove espaços invisíveis que podem vir do SNMP
                          var key = (lld[i]['{#IFNAME}'] || "").toString().trim();
                  
                          if (key && map[key]) {
                              lld[i]['{#TAG_CIRCUITO}'] = map[key].circuito;
                              lld[i]['{#TAG_CLIENTE}']  = map[key].cliente;
                              lld[i]['{#TAG_LOCAL}']    = map[key].localidade;
                          }
                      }
                      return JSON.stringify(lld);
                  } catch (error) {
                      // Se houver erro no JSON da macro, ele avisa no log do teste
                      return JSON.stringify([{"DEBUG_ERROR": error.message, "RAW_MACRO": rawMap}]);
                  }
          overrides:
            - name: 'Filtro de Tags de Circuito'
              step: '1'
              filter:
                conditions:
                  - macro: '{#TAG_CIRCUITO}'
                    value: .+
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: '.*'
                  tags:
                    - tag: Circuito
                      value: '{#TAG_CIRCUITO}'
                    - tag: Cliente
                      value: '{#TAG_CLIENTE}'
                    - tag: Localidade
                      value: '{#TAG_LOCAL}'
      macros:
